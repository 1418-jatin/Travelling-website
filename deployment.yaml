apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-website-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-website
  template:
    metadata:
      labels:
        app: travel-website
    spec:
      containers:
      - name: travel-website
        image: IMAGE_TAG   # replaced dynamically in Jenkinsfile
        ports:
        - containerPort: 80
